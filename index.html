<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資源分配計算ツール</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        table { margin: 20px auto; border-collapse: collapse; width: 50%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f4f4f4; }
        input { width: 80px; text-align: center; }
        button { margin-top: 10px; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>資源分配計算ツール</h2>
    <table>
        <tr>
            <th>資源</th>
            <th>総数</th>
            <th>獲得資源量</th>
        </tr>
        <tr>
            <td>鉄</td>
            <td><input type="number" id="iron" value="0"></td>
            <td id="ironResult">-</td>
        </tr>
        <tr>
            <td>食料</td>
            <td><input type="number" id="food" value="0"></td>
            <td id="foodResult">-</td>
        </tr>
        <tr>
            <td>金貨</td>
            <td><input type="number" id="gold" value="0"></td>
            <td id="goldResult">-</td>
        </tr>
    </table>
   <label>最大輸送量: <input type="number" id="maxTransport" value="0" step="0.1"></label>
    <br>
    <button onclick="calculateDistribution()">計算</button>
    
    <script>
        function calculateDistribution() {
            let iron = parseInt(document.getElementById("iron").value) || 1;
            let food = parseInt(document.getElementById("food").value) || 1;
            let gold = parseInt(document.getElementById("gold").value) || 1;
            let maxTransport = parseInt(document.getElementById("maxTransport").value) || 0;
            
            let total = iron + food + gold;
            if (total === 0) return;
            
            let ironShare = ((iron / total) * maxTransport).toFixed(1); // 小数点以下1桁
            let foodShare = ((food / total) * maxTransport).toFixed(1); // 小数点以下1桁
            let goldShare = (maxTransport - (parseFloat(ironShare) + parseFloat(foodShare))).toFixed(1); // 小数点以下1桁と調整
            
            document.getElementById("ironResult").innerText = ironShare;
            document.getElementById("foodResult").innerText = foodShare;
            document.getElementById("goldResult").innerText = goldShare;
        }
    </script>
</body>
</html>
