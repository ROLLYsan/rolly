<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資源分配計算ツール</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        table { margin: 20px auto; border-collapse: collapse; width: 50%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f4f4f4; }
        input { width: 80px; text-align: center; }
        button { margin-top: 10px; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>資源分配計算ツール</h2>
    <table>
        <tr>
            <th>資源</th>
            <th>総数</th>
            <th>獲得資源量</th>
        </tr>
        <tr>
            <td>鉄</td>
            <td><input type="number" id="iron"></td>
            <td id="ironResult">-</td>
        </tr>
        <tr>
            <td>食料</td>
            <td><input type="number" id="food"></td>
            <td id="foodResult">-</td>
        </tr>
        <tr>
            <td>金貨</td>
            <td><input type="number" id="gold"></td>
            <td id="goldResult">-</td>
        </tr>
    </table>
    <label>最大輸送量: <input type="number" id="maxTransport" step="0.1"></label>
    <br>
    <button onclick="calculateDistribution()">計算</button>
    <button onclick="resetValues()">リセット</button> <!-- リセットボタンを追加 -->
    
    <script>
        function calculateDistribution() {
            let iron = parseFloat(document.getElementById("iron").value) || 0;
            let food = parseFloat(document.getElementById("food").value) || 0;
            let gold = parseFloat(document.getElementById("gold").value) || 0;
            let maxTransport = parseFloat(document.getElementById("maxTransport").value) || 0;
            
            let total = iron + food + gold;
            if (total === 0 || maxTransport === 0) return;

            // 各資源の分配量を小数点以下まで計算
            let ironShare = (iron / total) * maxTransport;
            let foodShare = (food / total) * maxTransport;
            let goldShare = (gold / total) * maxTransport;

            // 各資源の分配後の合計
            let totalShare = ironShare + foodShare + goldShare;

            // 合計が最大輸送量に一致しない場合、差額を均等に分配
            let adjustment = maxTransport - totalShare;

            // 調整値を3つの資源に均等に分配
            let adjustmentPerResource = adjustment / 3;
            ironShare += adjustmentPerResource;
            foodShare += adjustmentPerResource;
            goldShare += adjustmentPerResource;

            // 小数点以下1桁で表示
            document.getElementById("ironResult").innerText = ironShare.toFixed(1);
            document.getElementById("foodResult").innerText = foodShare.toFixed(1);
            document.getElementById("goldResult").innerText = goldShare.toFixed(1);

            // 合計値の調整確認（最大輸送量と一致すること）
            console.log(`Iron: ${ironShare}, Food: ${foodShare}, Gold: ${goldShare}, Total: ${ironShare + foodShare + goldShare}`);
        }

        // リセット機能
        function resetValues() {
            // 入力フィールドをゼロにリセット
            document.getElementById("iron").value = 0;
            document.getElementById("food").value = 0;
            document.getElementById("gold").value = 0;
            document.getElementById("maxTransport").value = 0;

            // 獲得資源量を「-」にリセット
            document.getElementById("ironResult").innerText = "-";
            document.getElementById("foodResult").innerText = "-";
            document.getElementById("goldResult").innerText = "-";
        }
    </script>
</body>
</html>
